name: Keep API awake

# Render's free tier spins the service down after 15 minutes without traffic
# (cold start ~30-60s + the onward panel's in-memory caches are lost).
# A /health ping every 10 minutes keeps the instance warm; one service
# running 24/7 fits within Render's 750 free instance-hours per month.
# Note: GitHub pauses scheduled workflows after ~60 days of repo inactivity.

on:
  workflow_dispatch: # manual trigger for testing
  schedule:
    - cron: '*/10 * * * *'

jobs:
  ping:
    name: Ping /health
    runs-on: ubuntu-latest
    timeout-minutes: 3

    steps:
      - name: Ping API
        # Retry a few times: the first hit after a spin-down can take ~60s.
        run: |
          for i in 1 2 3; do
            code=$(curl -s -o /dev/null -w '%{http_code}' -m 90 https://lotsy-api.onrender.com/health) && \
              [ "$code" = "200" ] && echo "OK (attempt $i)" && exit 0
            echo "attempt $i failed (HTTP ${code:-timeout}), retrying..."
            sleep 10
          done
          echo "API did not respond with 200 after 3 attempts" >&2
          exit 1
