name: One-Way Engine

on:
  workflow_dispatch: # manual trigger for dev/testing
  schedule:
    - cron: '45 */3 * * *' # every 3 hours, offset from search.yml/charters.yml

jobs:
  run-oneway:
    name: Find one-way fares
    runs-on: ubuntu-latest
    timeout-minutes: 30 # Ryanair + Wizz (serial, throttle-safe) ~= 10-15 min

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.5.3

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile || true

      - name: Generate Prisma client
        run: packages/db/node_modules/.bin/prisma generate --schema=packages/db/prisma/schema.prisma
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Run database migrations
        run: packages/db/node_modules/.bin/prisma migrate deploy --schema=packages/db/prisma/schema.prisma
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Run one-way engine
        run: engine/node_modules/.bin/tsx engine/src/oneway.ts
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          NODE_ENV: production
          # Set to 'false' if Wizz starts blocking GitHub's datacenter IPs;
          # the engine then degrades to Ryanair-only.
          ENABLE_WIZZ: 'true'
