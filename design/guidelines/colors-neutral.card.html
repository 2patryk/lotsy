<!-- @dsCard group="Colors" viewport="700x170" name="Neutrals" subtitle="White · gray scale · charcoal text" -->
<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="../styles.css">
  <style>
    * { box-sizing: border-box; margin: 0; }
    body { background: #e8e8e8; padding: 20px; font-family: var(--font-sans); }
    .row { display: flex; gap: 10px; align-items: flex-start; }
    .swatch-col { display: flex; flex-direction: column; gap: 6px; align-items: center; flex: 1; }
    .swatch { width: 100%; height: 52px; border-radius: var(--radius-md); border: 1px solid rgba(0,0,0,0.06); }
    .label { font-size: 10px; color: #444; text-align: center; line-height: 1.3; font-family: monospace; }
    .val { font-size: 10px; color: #666; text-align: center; }
  </style>
</head>
<body>
  <div class="row">
    <div class="swatch-col">
      <div class="swatch" style="background: var(--color-bg);"></div>
      <div class="label">--color-bg</div>
      <div class="val">#f6f6f6</div>
    </div>
    <div class="swatch-col">
      <div class="swatch" style="background: var(--color-surface);"></div>
      <div class="label">--color-surface</div>
      <div class="val">#ffffff</div>
    </div>
    <div class="swatch-col">
      <div class="swatch" style="background: var(--color-sidebar-active);"></div>
      <div class="label">--color-sidebar-active</div>
      <div class="val">#f3f4f6</div>
    </div>
    <div class="swatch-col">
      <div class="swatch" style="background: var(--color-border);"></div>
      <div class="label">--color-border</div>
      <div class="val">#e5e7eb</div>
    </div>
    <div class="swatch-col">
      <div class="swatch" style="background: var(--color-text-tertiary);"></div>
      <div class="label">--color-text-tertiary</div>
      <div class="val">#9ca3af</div>
    </div>
    <div class="swatch-col">
      <div class="swatch" style="background: var(--color-text-secondary);"></div>
      <div class="label">--color-text-secondary</div>
      <div class="val">#6b7280</div>
    </div>
    <div class="swatch-col">
      <div class="swatch" style="background: var(--color-text-primary);"></div>
      <div class="label">--color-text-primary</div>
      <div class="val">#1a1a1a</div>
    </div>
  </div>
</body>
</html>
