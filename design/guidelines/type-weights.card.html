<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="../styles.css">
  <style>
    * { box-sizing: border-box; margin: 0; }
    body { background: var(--color-surface); padding: 20px; font-family: var(--font-sans); display: flex; flex-direction: column; gap: 12px; }
    .row { display: flex; align-items: baseline; gap: 16px; }
    .weight-label { font-size: 11px; color: var(--color-text-tertiary); font-family: monospace; width: 100px; flex-shrink: 0; }
    .sample { font-size: var(--text-lg); color: var(--color-text-primary); }
  </style>
</head>
<body>
  <div class="row">
    <div class="weight-label">400 regular</div>
    <span class="sample" style="font-weight: 400;">Tanie weekendy z Polski — Okazje weekendowe</span>
  </div>
  <div class="row">
    <div class="weight-label">500 medium</div>
    <span class="sample" style="font-weight: 500;">Tanie weekendy z Polski — Okazje weekendowe</span>
  </div>
  <div class="row">
    <div class="weight-label">600 semibold</div>
    <span class="sample" style="font-weight: 600;">Tanie weekendy z Polski — Okazje weekendowe</span>
  </div>
  <div class="row">
    <div class="weight-label">700 bold</div>
    <span class="sample" style="font-weight: 700;">Tanie weekendy z Polski — Okazje weekendowe</span>
  </div>
  <div class="row">
    <div class="weight-label">800 extrabold</div>
    <span class="sample" style="font-weight: 800;">Tanie weekendy z Polski — Okazje weekendowe</span>
  </div>
</body>
</html>
